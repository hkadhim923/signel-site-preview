<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guide d'achat 2026 | Signel Services</title>
<meta name="description" content="Le guide d'achat de Signel Services, page par page.">
<link rel="icon" href="/signel-site-preview/favicon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;background:#eaeaea;font:15px/1.5 "Red Hat Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#book{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.bar{position:fixed;top:12px;left:12px;z-index:5;display:flex;gap:8px;opacity:.6;transition:opacity .2s ease}
.bar:hover,.bar:focus-within{opacity:1}
.bar a,.bar button{font:600 12px/1 "Roboto Condensed",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.94);color:#004EA4;border:0;border-radius:4px;padding:8px 11px;cursor:pointer;
  text-decoration:none;box-shadow:0 1px 4px rgba(14,23,27,.18)}
.bar a:hover,.bar button:hover{background:#fff}
@media print{.bar{display:none}}
</style>
<link rel="alternate" hreflang="en-CA" href="https://hkadhim923.github.io/signel-site-preview/product-catalogue/">
<link rel="alternate" hreflang="fr-CA" href="https://hkadhim923.github.io/signel-site-preview/catalogue/">
<link rel="alternate" hreflang="x-default" href="https://hkadhim923.github.io/signel-site-preview/catalogue/">
<script>try{var l=localStorage.getItem('signel.lang');if(l&&l!==document.documentElement.lang.slice(0,2)){var a=document.querySelector('link[rel=alternate][hreflang^="'+l+'"]');if(a)location.replace(new URL(a.href).pathname+location.search+location.hash)}}catch(e){}</script>
</head>
<body>
<div class="bar">
<a href="/signel-site-preview/">&larr; Retour au site</a>
<button type="button" data-fullscreen>Plein écran</button>
<a class="lang" href="/signel-site-preview/product-catalogue/" data-lang-switch="en" hreflang="en" title="View this page in English" lang="en">EN</a>
</div>
<iframe id="book" src="https://online.anyflip.com/vpfa/rsbb/mobile/index.html" title="Guide d'achat 2026" allowfullscreen></iframe>
<script>
(function(){
  /* the language switch: the choice is remembered, as on every page (src/js/site.js) */
  var sw=document.querySelector('[data-lang-switch]');
  if(sw)sw.addEventListener('click',function(){try{localStorage.setItem('signel.lang',sw.getAttribute('data-lang-switch'));}catch(e){}});
  var b=document.querySelector('[data-fullscreen]'), el=document.documentElement;
  if(!el.requestFullscreen&&!el.webkitRequestFullscreen){b.hidden=true;return;}
  b.addEventListener('click',function(){
    var fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
  });
})();
</script>
</body>
</html>
